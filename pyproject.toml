[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialshap"
dynamic = ["version"]
description = "Spatially conditioned Shapley explanations for spatial machine-learning models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Jinghao Hu", email = "hujinghao20@mails.ucas.ac.cn"}
]
keywords = [
    "Shapley values",
    "explainable artificial intelligence",
    "spatial machine learning",
    "spatial statistics",
    "GIS",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.25.2",
    "scipy>=1.11.4",
    "pandas>=2.0.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7.2"]
geo = [
    "geopandas>=0.14.4",
    "shapely>=2.0.2",
    "pyproj>=3.6.0",
    "matplotlib>=3.7.2",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.7.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.7.2",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.8.0",
]
benchmark = [
    "geoshapley==0.2.0.0",
    "matplotlib>=3.7.2",
]
all = [
    "matplotlib>=3.7.2",
    "geopandas>=0.14.4",
    "shapely>=2.0.2",
    "pyproj>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/hujinghaoabcd/spatialshap"
Documentation = "https://hujinghaoabcd.github.io/spatialshap"
Repository = "https://github.com/hujinghaoabcd/spatialshap"
Issues = "https://github.com/hujinghaoabcd/spatialshap/issues"

[tool.setuptools.dynamic]
version = {attr = "spatialshap._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spatialshap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["spatialshap"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src/spatialshap"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
